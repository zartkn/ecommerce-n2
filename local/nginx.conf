# Imita o Ingress do EKS no docker-compose: mesmas regras de path, sem rewrite.
# Resolver do Docker para o NGINX achar os containers mesmo se subirem depois dele.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    set $catalogo    http://catalogo:3000;
    set $pedidos     http://pedidos:8000;
    set $pagamento   http://pagamento:8080;
    set $notificacao http://notificacao:8001;

    location /api/produtos      { proxy_pass $catalogo; }
    location /api/pedidos       { proxy_pass $pedidos; }
    location /api/pagamentos    { proxy_pass $pagamento; }
    location /api/notificacoes  { proxy_pass $notificacao; }
}
